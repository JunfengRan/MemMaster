[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memmaster"
version = "0.1.0"
description = "Local enterprise memory sidecar for OpenCode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Junfeng Ran" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.8",
  "httpx>=0.27",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
bge = ["FlagEmbedding>=1.3.0"]
dev = ["pytest>=8.0"]

[project.entry-points."memmaster.sources"]
mail = "memmaster.adapters.mail:MailAdapter"
meeting = "memmaster.adapters.meeting:MeetingAdapter"
im = "memmaster.adapters.im:IMAdapter"
web = "memmaster.adapters.web:WebAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
